# alikindoi search configuration.
# Every run reads this file; edit it to change what counts as a match.

criteria:
  # A title must contain one of these to count as senior.
  seniority_keywords: [senior, sr., sr , staff, lead, principal, architect]
  # Titles containing any of these are dropped.
  exclude_title_keywords:
    [junior, intern, internship, trainee, graduate, sales, recruiter, marketing,
     account executive, customer support, business development, teacher, profesor]
  # A job must mention one of these in its title or tags.
  role_keywords:
    [software, engineer, developer, programmer, robotics, robot, ros, c++,
     embedded, backend, back-end, computer vision, perception, autonomy,
     firmware, platform, systems]
  # Extra ranking weight for these (title, tags or description).
  boost_keywords: [robotics, ros 2, ros2, c++, perception, slam, autonomous, computer vision, embedded]

  location:
    # Remote jobs are accepted when their allowed regions include one of these,
    # or when they carry no region restriction at all.
    remote_allowed_regions:
      [spain, españa, europe, eu, emea, cet, worldwide, anywhere, global, international]
    # On-site or hybrid jobs are accepted only in these cities.
    hybrid_cities: [malaga, málaga, seville, sevilla]

  salary:
    min_eur_per_year: 48000
    # Keep openings that do not state a salary (they are flagged in the report).
    keep_unknown: true
    # Rough conversion rates to EUR; update occasionally.
    fx_to_eur: {EUR: 1.0, USD: 0.92, GBP: 1.17, CHF: 1.05, CAD: 0.67, PLN: 0.23, SEK: 0.088}

# Boards to query. Remove a block to disable a board; queries are free text.
sources:
  himalayas:
    queries: [senior software engineer, robotics, c++, ros]
    country: Spain
  remotive:
    queries: [senior software engineer, robotics, c++]
  remoteok:
    tags: [robotics, c++, backend, python]
  jobicy:
    tags: [robotics, c++, python, golang, java]
    geo: europe
  arbeitnow: {}
  rss:
    feeds:
      - name: weworkremotely-backend
        url: https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss
      - name: weworkremotely-fullstack
        url: https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss
      - name: weworkremotely-devops
        url: https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss

output:
  reports_dir: reports
  seen_file: data/seen.json
