services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      - ALIKINDOI_DATABASE_URL=sqlite:////app/data/alikindoi.db
    volumes:
      - ./data:/app/data
      - ./backend/config:/app/config
    ports:
      - "8000:8000"
    command: uvicorn alikindoi.api:app --host 0.0.0.0 --port 8000

  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      - ALIKINDOI_DATABASE_URL=sqlite:////app/data/alikindoi.db
    volumes:
      - ./data:/app/data
      - ./backend/config:/app/config
    command: python -m alikindoi schedule
    depends_on:
      - api

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3100:80"   # 3000 is occupied on this machine (Gitea)
    depends_on:
      - api
