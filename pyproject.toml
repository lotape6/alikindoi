[project]
name = "alikindoi"
version = "0.1.0"
description = "Automated job search: pulls openings from job boards, filters them by your criteria and reports only new ones."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
alikindoi = "alikindoi.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alikindoi*"]
