# Alikindoi configuration
# Secrets (API keys, proxies, notification creds) go in .env — never here.

app:
  # SQLite DB location (relative to repo root)
  database_url: "sqlite:///data/alikindoi.db"
  # Consecutive scrape runs a job can be missing before we probe its URL
  missing_runs_threshold: 2
  # Days after which an inactive job is hidden from default listings
  inactive_grace_days: 30

# Anti-ban settings. MINIMUMS ARE ENFORCED: values below the floor are
# rejected at load time so the config can't accidentally nuke rate limits.
rate_limits:
  # Minimum minutes between runs per source (hard floors, do not lower)
  min_interval_minutes:
    indeed: 30
    google: 30
    linkedin: 720      # LinkedIn is aggressive: >= 12h
    glassdoor: 120
    zip_recruiter: 120
    adzuna: 15
    remotive: 15
    themuse: 15
  # Random extra delay between individual searches (seconds)
  jitter_seconds_min: 2
  jitter_seconds_max: 8
  # Cap of results requested per source per search (hard ceiling)
  max_results_per_source: 100
  # Backoff on HTTP 429/403 (seconds, doubles each retry, max 3 retries)
  backoff_base_seconds: 60

sources:
  jobspy:   # scrapers — no keys needed
    indeed: { enabled: true }
    google: { enabled: true }
    linkedin: { enabled: false }   # enable only with proxies; see .env SCRAPER_PROXIES
    glassdoor: { enabled: false }  # Cloudflare-protected, unreliable
    zip_recruiter: { enabled: false }  # US/Canada only
  apis:
    adzuna: { enabled: false }     # needs ADZUNA_APP_ID / ADZUNA_APP_KEY in .env
    remotive: { enabled: true }    # public API, no key
    themuse: { enabled: false }    # needs THEMUSE_API_KEY in .env

# Search profiles: each is one scraping unit with its own cadence.
search_profiles:
  - name: "remote-spain-python"
    enabled: true
    search_term: "python developer"
    google_search_term: "python developer jobs remote Spain"
    location: "Spain"
    country_indeed: "Spain"
    adzuna_country: "es"
    is_remote: true
    job_type: "fulltime"
    tags: ["python", "backend", "remote"]
    results_wanted: 25
    hours_old: 72            # only fresh postings -> fewer requests
    interval_minutes: 360    # every 6h (>= per-source floors enforced)

  - name: "malaga-cadiz-onsite-hybrid"
    enabled: true
    search_term: "software engineer"
    google_search_term: "software engineer jobs in Málaga or Cádiz Spain"
    location: "Málaga, Spain"
    country_indeed: "Spain"
    adzuna_country: "es"
    is_remote: false
    job_type: null
    tags: ["software", "malaga", "cadiz", "hybrid", "onsite"]
    results_wanted: 25
    hours_old: 168           # 1 week — on-site markets move slower
    interval_minutes: 720    # every 12h

# Notification rules (Phase 6). Delivery channels configured via .env.
notifications:
  on_new_job: true
  on_removed_job: true
  on_salary_change: false
  digest: "immediate"        # immediate | daily
