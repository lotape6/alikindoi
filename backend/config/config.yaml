app:
  database_url: sqlite:///data/alikindoi.db
  missing_runs_threshold: 2
  inactive_grace_days: 30
rate_limits:
  min_interval_minutes:
    indeed: 360
    google: 360
    linkedin: 720
    glassdoor: 360
    zip_recruiter: 360
    adzuna: 360
    remotive: 360
    themuse: 360
  jitter_seconds_min: 2
  jitter_seconds_max: 8
  max_results_per_source: 100
  backoff_base_seconds: 60
sources:
  jobspy:
    indeed:
      enabled: true
    google:
      enabled: false
    linkedin:
      enabled: true
    glassdoor:
      enabled: false
    zip_recruiter:
      enabled: false
  apis:
    adzuna:
      enabled: true
    remotive:
      enabled: true
    themuse:
      enabled: true
search_profiles:
- name: python-developer
  enabled: true
  search_term: python developer
  google_search_term: 'python developer remote '
  location: Spain
  country_indeed: Spain
  adzuna_country: es
  is_remote: true
  job_type: fulltime
  tags:
  - python
  - software
  - developer
  results_wanted: 25
  hours_old: 72
  runs_per_day: 4
  interval_minutes: 360
- name: cpp-developer
  enabled: true
  search_term: '"c++" developer'
  google_search_term: c++ developer jobs remote Spain
  location: Spain
  country_indeed: Spain
  adzuna_country: es
  is_remote: true
  job_type: fulltime
  tags:
  - c++
  - software
  - developer
  results_wanted: 25
  hours_old: 72
  runs_per_day: 4
- name: c-developer
  enabled: true
  search_term: '"embedded c" OR "c programmer" developer'
  google_search_term: C programmer embedded developer jobs remote Spain
  location: Spain
  country_indeed: Spain
  adzuna_country: es
  is_remote: true
  job_type: fulltime
  tags:
  - c
  - embedded
  - software
  - developer
  results_wanted: 25
  hours_old: 72
  runs_per_day: 4
- name: malaga-cadiz-onsite-hybrid
  enabled: true
  search_term: software engineer (python OR "c++" OR c)
  google_search_term: software engineer python c++ jobs in Málaga or Cádiz Spain
  location: Málaga, Spain
  country_indeed: Spain
  adzuna_country: es
  is_remote: false
  job_type: null
  tags:
  - python
  - c++
  - c
  - software
  - malaga
  - cadiz
  - hybrid
  - onsite
  results_wanted: 25
  hours_old: 168
  runs_per_day: 2
notifications:
  on_new_job: true
  on_removed_job: true
  on_salary_change: false
  digest: immediate
