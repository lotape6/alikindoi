name: Job search

on:
  schedule:
    - cron: "0 6 * * *"  # every day at 06:00 UTC
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["alikindoi/**", "tests/**", "config.yaml"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .[test]
      - run: pytest -q

  search:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - run: alikindoi
      - name: Commit report
        run: |
          git config user.name "alikindoi bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports data/seen.json
          git diff --cached --quiet || git commit -m "Job search report $(date -u +%F)"
          git push
